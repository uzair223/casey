name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - name: Verify migrations apply on a fresh database
        run: npx supabase db start
      - run: npm run test:integration

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=4096
      NEXT_PUBLIC_APP_NAME: Casey
      NEXT_PUBLIC_BASE_URL: https://caseyhq.co.uk
      NEXT_PUBLIC_DOCUSEAL_URL: https://sign.caseyhq.co.uk
      DOCUSEAL_URL: https://sign.caseyhq.co.uk
      NEXT_PUBLIC_SUPPORT_EMAIL: support@caseyhq.co.uk
      NEXT_PUBLIC_CALENDLY_LINK: https://calendly.com/caseyhq/casey-demo-call
      AXIOM_DATASET: casey
      CSP_ENFORCE: "1"
      CLOUDFLARE_AI_GATEWAY_ID: default
      SUPABASE_PROJECT_ID: tkkvksnmigchatjaodmm
      SUPABASE_DB_REGION: eu-west-2
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM: ${{ secrets.RESEND_FROM }}
      CLOUDFLARE_AI_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_AI_ACCOUNT_ID }}
      CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
      CLOUDFLARE_ADMIN_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ADMIN_ACCOUNT_ID }}
      CLOUDFLARE_ADMIN_API_TOKEN: ${{ secrets.CLOUDFLARE_ADMIN_API_TOKEN }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_SEAT_PRICE_ID: ${{ secrets.STRIPE_SEAT_PRICE_ID }}
      DOCUSEAL_API_KEY: ${{ secrets.DOCUSEAL_API_KEY }}
      DOCUSEAL_WEBHOOK_SECRET: ${{ secrets.DOCUSEAL_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply Supabase migrations
        run: npm run supabase:push
      - name: Deploy Cloudflare Worker
        run: node scripts/with-cloudflare-admin.mjs opennextjs-cloudflare build && node scripts/with-cloudflare-admin.mjs opennextjs-cloudflare deploy
